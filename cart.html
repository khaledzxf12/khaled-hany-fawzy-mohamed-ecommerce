<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smart-Devices</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">smart-Devices</div>
        <nav id="nav-links">
            <a href="index.html">Store</a>
            <a href="cart.html" class="active">Cart (<span class="basket-badge">0</span>)</a>
        </nav>
    </header>

    <main class="container">
        <h2>Your Shopping Cart</h2>
        <div id="cart-wrapper" class="cart-layout">
            <div id="cart-items-list" class="cart-items"></div>
            <div id="cart-summary-box" class="summary-card">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal-val">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total-val">$0.00</span>
                </div>
                <button id="proceed-btn" class="btn btn-primary full-width">Proceed to Checkout</button>
            </div>
        </div>
        <div id="empty-notice" class="empty-msg hidden">
            <p>Your cart is currently empty.</p>
            <a href="index.html" class="btn">Return to Shop</a>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script src="js/cart-view.js"></script>
</body>
</html>
